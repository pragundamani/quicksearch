[package]
name = "quicksearch-cli"
version = "0.2.1"
edition = "2021"
description = "Fast terminal lookups for code and everything else"
license = "GPL-3.0-or-later"
repository = "https://github.com/pragundamani/quicksearch"
homepage = "https://github.com/pragundamani/quicksearch"
readme = "README.md"
exclude = ["docs/", "quicksearch.bash"]

[[bin]]
name = "qs"
path = "src/main.rs"

[dependencies]
cap-std = "4"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
keyring = "4.2"
regex = "1"
rpassword = "7.4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
ureq = { version = "2.12", features = ["json"] }
url = "2"
urlencoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
